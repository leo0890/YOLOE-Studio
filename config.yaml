model:
  weights: yoloe-26s-seg.pt
  default_prompt: [person, car, bus]
  warmup_imgsz: 640
  max_infer_retries: 2
  use_fp16: true
  auto_imgsz: true
  auto_imgsz_p95_ms: 400.0
  auto_imgsz_min: 416
  auto_imgsz_step: 64
  auto_imgsz_check_every: 30

camera:
  max_fails: 5
  reconnect_delay: 1.0
  reconnect_backoff_max: 15.0
  release_settle_s: 0.4

ui:
  default_conf: 0.25
  default_iou: 0.45
  default_imgsz: 640
  default_timer: 0.5
  mask_alpha: 0.45

server:
  host: 0.0.0.0
  port: 7860
  output_dir: recordings
  auth_user: ""
  auth_pass: ""
  block_private_hosts: true
  webhook_url: ""

pipeline:
  infer_queue_size: 1
  result_queue_size: 4

online:
  enabled: true
  buffer_size: 2000
  min_examples_per_class: 20
  conf_step: 0.02
  conf_min: 0.10
  conf_max: 0.90
  recalib_every: 50
  refine_every: 100
  refine_blend: 0.3
  buffer_dir: online_buffer
  save_crops: true
  crop_min_area: 400